<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beleg bingo">
<meta name="theme-color" content="#F7F5FC">
<title>Beleg bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --pu1:#EEEDFE; --pu2:#CECBF6; --pu3:#AFA9EC; --pu4:#7F77DD;
    --pu5:#534AB7; --pu6:#3C3489; --pu7:#26215C;
    --bg:#F7F5FC; --card:#FFFFFF;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--pu7);
    font-family:var(--sans); font-size:15px; line-height:1.5;
    padding:calc(env(safe-area-inset-top) + 20px) 14px calc(env(safe-area-inset-bottom) + 32px);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:460px; margin:0 auto}

  header{text-align:center; margin-bottom:20px}
  h1{
    font-family:var(--serif); font-weight:700; font-size:34px;
    color:var(--pu6); margin:0; line-height:1.05; letter-spacing:.01em;
  }
  .sub{font-size:13px; color:var(--pu4); margin-top:4px}

  .letters{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px}
  .letter{
    text-align:center; font-family:var(--serif); font-weight:700;
    font-size:26px; color:var(--pu4); line-height:1;
  }

  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}

  .cell{perspective:800px}
  .flipper{
    position:relative; width:100%; height:108px;
    transform-style:preserve-3d; transition:transform .5s ease;
  }
  .flipper.turned{transform:rotateY(180deg)}
  .face{
    position:absolute; inset:0; border-radius:12px; overflow:hidden;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column;
  }
  .front{
    background:var(--card); border:1px solid var(--pu2);
    padding:9px 6px 8px; align-items:center; justify-content:space-between;
  }
  .naam{
    font-family:var(--serif); font-weight:600; font-size:17px; line-height:1.1;
    color:var(--pu6); text-align:center;
    overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto;
  }
  .naam.lang{font-size:14px}
  .marks{display:grid; grid-template-columns:repeat(2,1fr); gap:5px}
  .mark{
    width:23px; height:23px; border-radius:6px;
    border:1px solid var(--pu3); background:#fff; color:var(--pu2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none; transition:background .12s ease;
  }
  .mark svg{display:block}
  .mark[aria-checked="true"]{background:var(--pu4); border-color:var(--pu5); color:#fff}
  .mark:focus-visible{outline:2px solid var(--pu5); outline-offset:2px}

  .back{
    transform:rotateY(180deg); border:1px solid var(--pu3);
    background:var(--pu1) center/cover no-repeat;
    cursor:pointer; justify-content:flex-end; align-items:stretch;
  }
  .back .tag{
    font-size:10px; font-weight:500; color:var(--pu7);
    background:rgba(255,255,255,.82); padding:3px 4px; text-align:center;
    letter-spacing:.02em;
  }
  .back:focus-visible{outline:2px solid var(--pu5); outline-offset:2px}

  .banner{
    margin-top:14px; text-align:center; background:var(--pu1);
    border:1px solid var(--pu3); border-radius:12px; padding:12px 14px;
  }
  .banner .big{font-family:var(--serif); font-weight:700; font-size:22px; color:var(--pu6); line-height:1.1}
  .banner .small{font-size:12.5px; color:var(--pu5); margin-top:3px}

  .status{
    margin-top:16px; display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap;
  }
  .count{font-size:12.5px; color:var(--pu5)}
  .btn{
    font-family:var(--sans); font-size:12.5px; color:var(--pu5);
    background:#fff; border:1px solid var(--pu2); border-radius:9px;
    padding:7px 11px; cursor:pointer;
  }
  .btn:active{background:var(--pu1)}
  .btnrow{display:flex; gap:8px}

  .panel{
    margin-top:14px; background:#fff; border:1px solid var(--pu2);
    border-radius:12px; padding:14px;
  }
  .panel h2{
    font-family:var(--serif); font-size:19px; font-weight:600;
    color:var(--pu6); margin:0 0 4px;
  }
  .panel p{font-size:12.5px; color:var(--pu5); margin:0 0 12px}
  .panel .fields{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
  .panel input{
    width:100%; font-family:var(--sans); font-size:14px; color:var(--pu7);
    background:var(--bg); border:1px solid var(--pu2); border-radius:8px;
    padding:9px 10px; min-height:40px;
  }
  .panel input:focus{outline:none; border-color:var(--pu4)}
  .hidden{display:none}

  @media (prefers-reduced-motion: reduce){
    .flipper{transition:none}
  }
  @media (max-width:360px){
    .flipper{height:100px}
    .naam{font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Beleg bingo</h1>
    <div class="sub">vier boterhammen per beleg</div>
  </header>

  <div class="letters" aria-hidden="true">
    <div class="letter">B</div><div class="letter">I</div>
    <div class="letter">N</div><div class="letter">G</div>
  </div>

  <div class="board" id="board"></div>

  <div class="banner hidden" id="banner" role="status">
    <div class="big" id="bannerBig"></div>
    <div class="small" id="bannerSmall"></div>
  </div>

  <div class="status">
    <span class="count" id="count"></span>
    <div class="btnrow">
      <button class="btn" id="editBtn">Beleg aanpassen</button>
      <button class="btn" id="resetBtn">Nieuwe week</button>
    </div>
  </div>

  <div class="panel hidden" id="panel">
    <h2>Beleg aanpassen</h2>
    <p>Twaalf vakjes. Wat je hier typt staat op het bord — de kruisjes blijven staan.</p>
    <div class="fields" id="fields"></div>
  </div>

</div>

  const DEFAULTS = ['Kaas','Hesp','Kipfilet','Salami','Choco','Confituur','Pindapasta','Honing','Hummus','Smeerkaas','Eiersalade','Kruidenkaas'];
  const CROSS = '<svg viewBox="0 0 12 12" width="14" height="14" aria-hidden="true"><path d="M3.2 3.2 L8.8 8.8 M8.8 3.2 L3.2 8.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';

  const LINES = [];
  for (let r = 0; r < 3; r++) LINES.push([r*4, r*4+1, r*4+2, r*4+3]);
  for (let c = 0; c < 4; c++) LINES.push([c, c+4, c+8]);

  let items = DEFAULTS.slice();
  let marks = DEFAULTS.map(() => [false, false, false, false]);
  let peek = {};

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (Array.isArray(d.items) && d.items.length === 12) items = d.items.map(String);
      if (Array.isArray(d.marks) && d.marks.length === 12) {
        marks = d.marks.map(function(row){
          const r = Array.isArray(row) ? row : [];
          return [0,1,2,3].map(function(i){ return r[i] === true; });
        });
      }
    } catch(e){}
  }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify({ items: items, marks: marks })); } catch(e){}
  }

  function isFull(i){ return marks[i].every(Boolean); }

  function makeMark(i, n){
    const el = document.createElement('div');
    el.className = 'mark';
    el.innerHTML = CROSS;
    el.setAttribute('role', 'checkbox');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-checked', marks[i][n] ? 'true' : 'false');
    el.setAttribute('aria-label', items[i] + ', boterham ' + (n + 1));
    function toggle(){
      marks[i][n] = !marks[i][n];
      delete peek[i];
      save();
      render();
    }
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', function(e){
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
    });
    return el;
  }

  function render(){
    const board = document.getElementById('board');
    board.innerHTML = '';

    items.forEach(function(naam, i){
      const cell = document.createElement('div');
      cell.className = 'cell';

      const flipper = document.createElement('div');
      flipper.className = 'flipper' + (isFull(i) && !peek[i] ? ' turned' : '');

      const front = document.createElement('div');
      front.className = 'face front';
      const label = document.createElement('div');
      label.className = 'naam' + (naam.length > 9 ? ' lang' : '');
      label.textContent = naam;
      const grid = document.createElement('div');
      grid.className = 'marks';
      for (let n = 0; n < 4; n++) grid.appendChild(makeMark(i, n));
      front.appendChild(label);
      front.appendChild(grid);

      const back = document.createElement('div');
      back.className = 'face back';
      back.style.backgroundImage = 'url(' + HOND + ')';
      back.setAttribute('role', 'button');
      back.setAttribute('tabindex', isFull(i) ? '0' : '-1');
      back.setAttribute('aria-label', naam + ' is volledig. Tik om de kruisjes te zien.');
      const tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = naam;
      back.appendChild(tag);
      function flipBack(){ peek[i] = true; render(); }
      back.addEventListener('click', flipBack);
      back.addEventListener('keydown', function(e){
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipBack(); }
      });

      flipper.appendChild(front);
      flipper.appendChild(back);
      cell.appendChild(flipper);
      board.appendChild(cell);
    });

    const full = items.map(function(_, i){ return isFull(i); });
    const volle = full.filter(Boolean).length;
    const totaal = marks.reduce(function(a, row){ return a + row.filter(Boolean).length; }, 0);
    const lijnen = LINES.filter(function(l){ return l.every(function(ix){ return full[ix]; }); }).length;

    const banner = document.getElementById('banner');
    const big = document.getElementById('bannerBig');
    const small = document.getElementById('bannerSmall');
    if (volle === 12) {
      banner.classList.remove('hidden');
      big.textContent = 'Volle kaart';
      small.textContent = 'Twaalf soorten beleg, achtenveertig boterhammen.';
    } else if (lijnen > 0) {
      banner.classList.remove('hidden');
      big.textContent = lijnen === 1 ? 'Bingo' : 'Bingo, ' + lijnen + ' lijnen';
      small.textContent = 'Een volle lijn op het bord.';
    } else {
      banner.classList.add('hidden');
    }

    document.getElementById('count').textContent =
      volle + ' van 12 vol · ' + totaal + ' van 48 boterhammen';
  }

  function renderFields(){
    const box = document.getElementById('fields');
    box.innerHTML = '';
    items.forEach(function(naam, i){
      const input = document.createElement('input');
      input.type = 'text';
      input.value = naam;
      input.setAttribute('aria-label', 'Beleg ' + (i + 1));
      input.addEventListener('input', function(){
        items[i] = input.value;
        save();
        render();
      });
      box.appendChild(input);
    });
  }

  document.getElementById('editBtn').addEventListener('click', function(){
    const panel = document.getElementById('panel');
    const open = panel.classList.toggle('hidden');
    this.textContent = open ? 'Beleg aanpassen' : 'Klaar met aanpassen';
    if (!open) {
      renderFields();
      if (panel.scrollIntoView) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('Alle kruisjes wissen en met een lege kaart beginnen? Het beleg blijft staan.')) return;
    marks = items.map(function(){ return [false, false, false, false]; });
    peek = {};
    save();
    render();
  });

  load();
  render();
})();
</script>
</body>
</html>
